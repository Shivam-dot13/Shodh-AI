[pytest]
testpaths = /srv/tests
pythonpath = /srv/api /srv /srv/tests
python_files = test_*.py
addopts = -ra --strict-markers --timeout=600
markers =
    unit: pure rule tests, no database and no execution
    integration: needs the database and the API; judging uses the configured execution mode
    realrunner: needs a real Docker daemon; proves container isolation and resource limits
    concurrency: needs exclusive control of the judge queue (workers stopped) and coordinates
        competing clients with barriers
